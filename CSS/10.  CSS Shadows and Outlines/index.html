<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid burlywood;
            padding: 35px;
            margin: 20px;
            box-shadow: 11px 11px 15px 5px #888888;
            color: red;
            outline: 12px initial red;

        }
    </style>    
</head>

<body>
    <div class="box">
        Shadows look like this
    </div>
</body>

</html>
