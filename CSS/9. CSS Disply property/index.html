<!-- disply propertys help to customize disply elemnts   -->
<!-- exmples - felx , inline-flex , block , inline-block using this we can customize block elements  -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css display property</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            display: inline-flex;
            justify-content: center;
            padding: 12px;
            margin: 15px;


        }

        /* go for more disply propertys */
        /* https://developer.mozilla.org/en-US/docs/Web/CSS/display */
    </style>
</head>

<body>
    <div class="box">Wellcome</div>

    <span class="box">to jaimindecode</span>

    <main>
        <div style="background-color: red;">
            disply propertys help to customize disply elemnts
        </div>
    </main>

    <h1>for exmples</h1>

    <ol>
        <li>felx</li>
        <li>inline-flex</li>
        <li>block</li>
        <li>inline-block</li>

    </ol>

</body>

</html>
