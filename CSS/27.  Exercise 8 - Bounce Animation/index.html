<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8 - Bounce Animation</title>

    <style>
        main {
            background-color: rgb(255, 237, 237);
            height: 70vh;
            width: 80%;
        }

        .ball {
            background-color: blueviolet;
            border-radius: 50%;
            height: 22vh;
            width: 22vh;


            animation-name: position;
            animation-duration: 5s;
            animation-iteration-count: 1;
            animation-timing-function: cubic-bezier(0.63, 0.28, 0.57, 0.92);
            animation-fill-mode: forwards;
            animation-delay: 1s;



        }

        @keyframes position {
            0% {
                transform: translatey(0px);
            }

            20% {
                transform: translatey(500px) translatex(100px) scaleY(0.5);


            }

            40% {
                transform: translatey(20px) translatex(200px) scaleY(1);

            }

            60% {
                transform: translatey(500px) translatex(300px) scaleY(0.4);

            }

            80% {
                transform: translatey(50px) translatex(400px) scaleY(0.99);

            }

            95% {
                transform: translatey(500px) translatex(500px) scaleY(0.2);

            }

            100% {
                transform: translatey(500px) translatex(500px) scaleY(0.998);


            }


        }

        /* @keyframes aspect {

           0%{ transform: translatey(550px);}
           10%{ transform: scaleY(0.1);}

        } */
    </style>
</head>

<body>
    <main>
        <div class="ball">

        </div>
    </main>
</body>

</html>
