<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8 - Bounce Animation</title>

    <style>
        main {
            position: relative;
            background-color: rgb(255, 237, 237);
            height: 80vh;
            width: 97%;
        }

        .ball {
            background-color: blueviolet;
            border-radius: 50%;
            height: 22vh;
            width: 22vh;
            position: absolute;
            bottom: 0%;
            left: 0%;


            animation: motionx 3s linear infinite, motiony 1s ease-out infinite alternate;



        }

        @keyframes motionx {
            from {
                left: 0%;
            }

            to {
                left: 90%;
            }
        }

        @keyframes motiony {
            from {
                bottom: 0%;
            }

            to {
                bottom: 70%;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="ball">

        </div>
    </main>
</body>

</html>
