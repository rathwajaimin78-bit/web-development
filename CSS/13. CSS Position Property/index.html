<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }



        .box {
            padding: 3px;
            margin: 3px;
            border: 2px solid black;

            height: 433px;
            width: 80vw;
        }

        .box1 {
            background-color: rgb(170, 17, 119);

            /* sticky positon usw for somthing stay on screen even we scroll */
            position: sticky;
            top: 0px;
            height: 111px;
            /* in absolute position we can change positon  related to most outer parent position  */

        }

        .box2 {
            /* in relative position we can change positon  related to old position  */
            background-color: rgb(196, 196, 6);
            /* position: relative;
            top: 34px;
            left: 56px;
            z-index: -1; */
            /* fixed help to fix somthing at position to show fixed */
            position: fixed;
            bottom: 0px;
            height: 111px;


        }

        .box3 {
            background-color: rgb(0, 134, 252);
            /* position: absolute; */
            /* top: 0px; */
        }

        .box4 {
            background-color: rgb(18, 199, 48);
        }

        .parent {
            padding: 34px;
            margin: 43px;
            border: 2px solid black;
            /* position: absolute  ; */


            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned*/

            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */

            
        }
    </style>
</head>

<body>

    <div class="parent">

        <div class="box box1">nav</div>
        <div class="box box2">news</div>
        <div class="box box3"></div>
        <div class="box box4"></div>

    </div>
</body>

</html>

<!-- points to keep in mind -->
<!-- 1) the default position of an element is static: we cant move it, properties like top, left, bottom, right have no effects
2) position: relative; now we can use top, bottom, left, right properties
3) position: absolute; will set position with respect to its parent element otherwise it will be positioned with respect to <html>
note: transform, filter or perspective properties can also be considered as positioned

4) position: fixed; will keep the element in place when scrolled, in other words: fixed to the viewport
5) position: sticky; mix of relative and fixed. Will act as relative but as soon as we scroll, it will act as fixed (ex: nav bar)
6) z-index: if 2 or moreelements overlap each other while setting the position, we can define z-index, higher the z-index value, higher it will be placed in the front -->
