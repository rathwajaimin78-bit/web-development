<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box modle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* total height of elemnt is content height + border height + left and right margin  */
        .box {

            margin: 25px;
            padding: 10px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }

        .box1 {
            background-color: rgb(233, 135, 7);
        }

        .box2 {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="box box2">

        hi! wellcome to the
    </div>

    <div class="box1 box">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; Jaimin Decode

    </div>

</body>

</html>
