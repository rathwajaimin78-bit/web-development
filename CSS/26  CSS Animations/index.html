<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container {
            background-color: antiquewhite;
            height: 70vh;
            width: 80vw;
            margin: 10px;
            padding: 10px;

            display: flex;
            gap: 10px;

        }

        .box {
            background-color: red;
            height: 2vh;
            width: 2vw;

            animation-name: loading;
            animation-duration: 1.5s;
            animation-iteration-count: 3;
            animation-timing-function: ease-out;

        }

        @keyframes loading {
            form {}

            to {
                transform: translatex(1000px);
                /* translate: scaleX(1); */
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box ">

        </div>
        <div class="box ">

        </div>
        <div class="box ">

        </div>
    </div>
</body>

</html>
