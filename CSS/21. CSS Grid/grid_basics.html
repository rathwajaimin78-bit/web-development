<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            margin: 12px;
            border: 2px solid black;

            height: 50vh;
            width: 80vw;

            display: grid;
            /* grid-template-columns: 120px 100px;
            grid-template-rows: 100px 100px 100px; */
            
            /* we can use fr for allowing grid width and height */
            grid-template-columns: 1fr 1fr;

            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 1fr 2fr 1fr;
            gap: 12px;
            row-gap: 10px;
            column-gap: 15px;

            justify-items: center;
            align-items: center;
        }

        .item {
            border: 2px solid rebeccapurple;
            /* height: 55px; */
            width: 55px;
            
        }


        /* grid-row and grid-column use for adjust elements i grid */
        .item-4 {
            grid-row: 4/2;
            /* we can also write as grid-row-start : 1 and grid-row-end :2*/
            grid-column: 1/2;
            
        }

        .item-1 {
            grid-row: 1/2;
            grid-column: 1/2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item ">1</div>
        <div class="item ">2</div>
        <div class="item ">3</div>
        <div class="item ">4</div>
        <div class="item">5</div>
    </div>
</body>

</html>
