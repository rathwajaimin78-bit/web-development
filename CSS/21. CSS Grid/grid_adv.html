<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            margin: 12px;
            border: 2px solid black;

            display: grid;
            grid-template-areas: "nav nav nav"
                "side artical artical"
                "footer footer footer";
        }

        .item {
            border: 2px solid rebeccapurple;
            height: 55px;
            /* width: 55px; */
        }


        /* grid-row and grid-column use for adjust elements i grid */


        .item-1 {
            grid-area: nav;
            background-color: blueviolet;
        }

        .item-2 {
            grid-area: side;
            background-color:rgb(97, 92, 124);
        }

        .item-3 {
            grid-area: artical;
        }

        .item-4 {
            grid-area: footer;
            background-color: rgb(206, 146, 18);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1 navbar</div>
        <div class="item item-2">2 aside</div>
        <div class="item item-3">3 article</div>
        <div class="item item-4">4 footer</div>
        <!-- <div class="item ">5</div> -->
    </div>
</body>

</html>
