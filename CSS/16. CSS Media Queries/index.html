<!DOCTYPE html>
<html lang="en">


<!-- media Queries help to change view accoding to device ,it to manage wibsite look in other device   -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: whitesmoke;
        }

        .header {
            margin: auto;
            display: flex;
            justify-content: center;
            padding: 5px;
            height: 2hv;
            width: auto;
        }

        h1 {
            margin: 10px;
            padding: 10px;
            display: flex;
            justify-self: center;
            font-family: cursive;
            color: rgb(172, 232, 232);
        }

        .boxs {
            display: inline-flex;
        }

        .box {
            height: 800px;
            width: 300px;
            background-color: gray;
            padding: 3px;
            margin: 2px;
        }

        .Main {

            border: 1px solid black;
            height: 800px;
            width: 1240px;
            padding: 3px;
            margin: 5px;
        }

        .nav_elements {
            margin: auto;
            display: inline-flex;
            padding: 5px;
            height: 1hv;
            width: auto;

            background-color: rgb(143, 38, 175);
            list-style: none;
        }

        .nav {
            margin: 2px;
            padding: 3px;

            background-color: rgb(143, 38, 175);
        }

        @media only screen and (max-width : 500px) {
            body {
                background-color: rgb(59, 59, 211);
            }

            h1 {
                color: rgb(232, 111, 111);
            }
        }
    </style>
</head>

<body>

    <h1>This is media Queries</h1>

    <nav class="nav">
        <ul>
            <li class="nav_elements">Home</li>
            <li class="nav_elements">video</li>
            <li class="nav_elements">audio</li>
            <li class="nav_elements">About</li>
        </ul>
    </nav>
    <div class="boxs">

        <aside class="box boxs">
            content aside navbar
        </aside>

        <main class="Main boxs">
            this is the main content
        </main>
    </div>
</body>

</html>
